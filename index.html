<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chicken!</title>
  <style>
    body {
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .typing {
      color: #e0e0e0; /* light grey */
      font-family: monospace;
      font-size: 3rem;
      border-right: 3px solid #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      animation: typing 2s steps(8, end) forwards, blink 0.7s step-end infinite;
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 8ch; }
    }
    @keyframes blink {
      50% { border-color: transparent; }
    }
  </style>
</head>
<body>
  <div class="typing">chicken!</div>
</body>
</html>
